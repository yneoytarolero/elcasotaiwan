<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL CASO TaiwanConDrip</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0a0a0a;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            overflow:hidden;
        }

        .container{
            text-align:center;
        }

        h1{
            font-size:4rem;
            color:#ff2d2d;
            text-shadow:
                0 0 10px #ff2d2d,
                0 0 30px #ff0000,
                0 0 60px #ff0000;
            animation:pulse 2s infinite;
        }

        p{
            margin-top:20px;
            font-size:1.2rem;
            color:#cfcfcf;
        }

        @keyframes pulse{
            0%,100%{
                transform:scale(1);
                opacity:1;
            }
            50%{
                transform:scale(1.05);
                opacity:.8;
            }
        }

        .background{
            position:fixed;
            inset:0;
            background:
                radial-gradient(circle at center,#300000 0%,#120000 40%,#000 100%);
            z-index:-1;
        }
    </style>
</head>
<body>

<div class="background"></div>

<div class="container">
    <h1>EL CASO TaiwanConDrip</h1>
    <p>Próximamente...</p>
</div>

</body>
</html>
